spring:
  application:
    name: bigin

  profiles:
    active: local

  h2:
    console:
      enabled: true         # H2 Console 활성화
      path: /h2-console     # 접속 경로
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test   # 인메모리 DB
    username: sa
    password:
    hikari:
      pool-name: bigin-hikari
      # loanLimitExecutor(max=40)의 각 스레드가 inquiry() 트랜잭션 동안 커넥션 1개씩
      # 붙잡을 수 있어서, maximum-pool-size는 최소 그 값 + 콜백(@Lock PESSIMISTIC_WRITE)/
      # 아웃박스 배치 발행/기타 트랜잭션 경로 여유분을 더해서 잡는다.
      maximum-pool-size: 150
      minimum-idle: 20
      connection-timeout: 3000    # 커넥션 획득 대기 3초 초과 시 빠르게 실패 (원인 파악 쉽게)
      max-lifetime: 1800000       # 30분마다 커넥션 재생성
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Kafka 자동설정 비활성화 (로컬 테스트 시 Kafka 없이 기동)
  #autoconfigure:
  #  exclude:
  #    - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647           # Integer.MAX_VALUE - 재시도 횟수가 아니라 delivery.timeout.ms로 시간을 제한
        delivery.timeout.ms: 480000   # 전체 전송 시도(재시도 포함)의 최대 허용 시간
        max.block.ms: 3000            # 메타데이터/버퍼 대기 상한 (기본 60초는 너무 김)
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        group.instance.id: ${HOSTNAME:bigin-customer}-${random.uuid}

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  batch:
    jdbc:
      initialize-schema: always   # 운영은 always -> never + 사전 마이그레이션으로 전환
    job:
      enabled: false              # @Scheduled로만 기동, 앱 시작 시 자동 실행 방지
    jpa:
      properties:
        hibernate:
          jdbc:
            batch_size: 500       # Notification/Outbox bulk insert 최적화
          order_inserts: true
          order_updates: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
    health:
      show-details: always
  endpoint:
    prometheus:
      enabled: true
  metrics:
    enable:
      resilience4j: true
    export:
      prometheus:
        enabled: true
    tags:
      # 모든 매트릭에 애플리케이션 이름 태그 추가
      # Grafana에서 application="bigin" 로 필터링 가능
      application: bigin

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    groups-order: DESC
    doc-expansion: none
  api-docs:
    path: /api-docs
    enabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        timeout-duration: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 7s    # readTimeout과 동일하게 (느린 호출도 실패로 count)
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 60s    # readTimeout보다 충분히 길게 - 파트너 회복 시간 확보
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        max-wait-duration-in-half-open-state: 10s
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      # default를 그대로 상속하고 예외 타입만 각 도메인 것으로 교체
      loan-default:
        base-config: default
        record-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiServerException
        ignore-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiClientException

      notification-default:
        base-config: default
        record-exceptions:
