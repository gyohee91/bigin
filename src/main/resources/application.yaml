spring:
  application:
    name: bigin

  profiles:
    active: local

  h2:
    console:
      enabled: true         # H2 Console 활성화
      path: /h2-console     # 접속 경로
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test   # 인메모리 DB
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Kafka 자동설정 비활성화 (로컬 테스트 시 Kafka 없이 기동)
  #autoconfigure:
  #  exclude:
  #    - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    enable:
      resilience4j: true
    export:
      prometheus:
        enabled: true
    tags:
      # 모든 매트릭에 애플리케이션 이름 태그 추가
      # Grafana에서 application="bigin" 로 필터링 가능
      application: bigin

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    groups-order: DESC
    doc-expansion: none
  api-docs:
    path: /api-docs
    enabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        limit-refresh-period: 1s
        timeout-duration: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 7s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        max-wait-duration-in-half-open-state: 10s
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      # default를 그대로 상속하고 예외 타입만 각 도메인 것으로 교체
      loan-default:
        base-config: default
        record-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiServerException
        ignore-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiClientException

      notification-default:
        base-config: default
        record-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiServerException
        ignore-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiClientException

    instances:
      KAKAO_BANK:
        base-config: loan-default
      TOSS_BANK:
        base-config: loan-default
      LINE_BANK:
        base-config: loan-default
        limit-for-period: 20
      SMS:
        base-config: notification-default
      EMAIL:
        base-config: notification-default
      KAKAOTALK:
        base-config: notification-default
      PUSH:
        base-config: notification-default

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        max-wait-duration: 10s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
          - com.ghyinc.finance.global.exception.ExternalApiServerException
        ignore-exceptions:
          - com.ghyinc.finance.global.exception.ExternalApiClientException

